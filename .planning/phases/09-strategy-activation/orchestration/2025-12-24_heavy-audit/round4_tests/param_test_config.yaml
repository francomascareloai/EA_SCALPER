# ROUND 4: Parameter Sensitivity Test Config
# Base config with MeanRevert parameters exposed for testing

confluence:
  min_score_to_trade: 35
  execution_threshold: 35
  weights:
    structure: 15
    regime: 10
    liquidity_sweep: 12
    amd_cycle: 10
    order_block: 15
    fvg: 10
    fib: 10
    mtf: 15
    footprint: 0

risk:
  max_risk_per_trade: 0.005
  dd_soft: 0.03
  dd_hard: 0.05

news:
  enabled: true
  events_path: nautilus_gold_scalper/data/raw/forex_factory_calendar_usd_top_movers_validated.csv

execution:
  execution_threshold: 35
  slippage_ticks: 2
  latency_ms: 70
  commission_source: manual
  commission_per_contract: 2.5
  fill_model: realistic
  use_session_filter: true
  use_regime_filter: false  # OFF to isolate signal parameters
  use_mtf: false  # OFF to avoid H1 bar issue
  require_htf_align: false  # OFF to avoid H1 bar step=60 error
  use_footprint: false
  use_selector: false

  # MeanRevert enabled
  enable_smc: false
  enable_trend_follow: false
  enable_mean_revert: true
  force_mean_revert: true

  # MeanRevert parameters (TEST BASELINE)
  mean_revert_bb_period: 20
  mean_revert_bb_k: 2.0
  mean_revert_rsi_period: 14
  mean_revert_rsi_oversold: 30.0
  mean_revert_rsi_overbought: 70.0
  mean_revert_max_atr_percentile: 70.0
  mean_revert_sl_atr_multiplier: 10.0
  mean_revert_tp_atr_multiplier: 8.0
  mean_revert_use_atr_exits: true
  mean_revert_adx_period: 14
  mean_revert_max_adx: 25.0
  mean_revert_use_adx_filter: true

spread:
  warning_ratio: 2.0
  block_ratio: 5.0

spread_monitor:
  history_size: 200
  max_spread_pips: 45.0

time:
  cutoff_et: '16:55'

session:
  broker_gmt_offset: 0
  allow_asian: true
  allow_late_ny: true
