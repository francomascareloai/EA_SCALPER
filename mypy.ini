[mypy]
python_version = 3.12
strict = True
follow_imports = skip
files = scripts/convert_csv_to_nautilus_catalog.py,scripts/build_nautilus_catalogs.py,scripts/data/validate_nautilus_catalog.py,tests/test_nautilus_catalog_conversion.py

ignore_missing_imports = True

explicit_package_bases = True

# Ensure mypy resolves modules under the same canonical root.
# This repo uses `nautilus_gold_scalper/src` as the import root for `src.*`.
mypy_path = nautilus_gold_scalper
namespace_packages = True

# Avoid archived/legacy duplicates and data folders.
exclude = (?x)
    (^|/)\.venv(/|$)
  | (^|/)\.rag-db(/|$)
  | (^|/)data(/|$)
  | (^|/)external(/|$)
  | (^|/)tools/antigravity(/|$)
  | (^|/)nautilus_gold_scalper/src/execution/_archive(/|$)
  | (^|/)nautilus_gold_scalper/src/optimization(/|$)
  | (^|/)nautilus_gold_scalper/tests(/|$)
  | (^|/)nautilus_gold_scalper/scripts(/|$)
  | (^|/)nautilus_gold_scalper/src/validation(/|$)
  | (^|/)nautilus_gold_scalper/src/ml(/|$)
  | (^|/)nautilus_gold_scalper/test_.*\.py$

# NOTE: mypy applies `exclude` to both files and directories. If a directory
# is excluded, mypy won't recurse and may report "There are no .py[i] files".
