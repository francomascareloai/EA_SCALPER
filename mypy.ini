[mypy]
python_version = 3.12
strict = True
follow_imports = skip
files = scripts/convert_csv_to_nautilus_catalog.py,scripts/build_nautilus_catalogs.py,scripts/data/validate_nautilus_catalog.py,tests/test_nautilus_catalog_conversion.py

ignore_missing_imports = True

explicit_package_bases = True

# Avoid archived/legacy duplicates and data folders.
exclude = (?x)
    # When running `mypy --strict .`, only type-check the allowlisted entrypoints below.
    # This keeps strict typing where it matters while avoiding unrelated experimental/scripts
    # from breaking the CI gate.
    ^(?!(
        (\./)?scripts/?$
      | (\./)?scripts/data/?$
      | (\./)?tests/?$
      | (\./)?scripts/convert_csv_to_nautilus_catalog\.py$
      | (\./)?scripts/build_nautilus_catalogs\.py$
      | (\./)?scripts/data/validate_nautilus_catalog\.py$
      | (\./)?tests/test_nautilus_catalog_conversion\.py$
    )).*
