# All Strategies Optimization Configuration - FAST MODE
# Unified sweep: SMC + TrendFollow (pullback/breakout/swing) + MeanRevert
# Apex Optimizer (successive_halving)
#
# NOTE:
# - This config is designed to work with BacktestRunner's `_deep_update` merging.
# - Dotpaths like `execution.psar_enabled` map into `GoldScalperConfig` via
#   `scripts/backtest/run_backtest.py:build_strategy_config`.

metadata:
  name: "All Strategies Unified Optimization - Fast"
  version: "1.0"
  description: "Unified multi-strategy parameter sweep with successive_halving and Apex constraints"
  author: "Franco"
  created: "2025-12-25"

search:
  mode: successive_halving
  trials: 72
  sampler: lhs
  parallelism: 4
  timeout_per_trial: 300
  seed: 42

  successive_halving:
    enabled: true
    eta: 3
    # Rung 0: 30d window + 1 WFA fold (cheap)
    # Rung 1: 365d window + 3 WFA folds (medium)
    # Rung 2: full window + 5 WFA folds (rigorous)
    window_days: [30, 365, 0]
    wfa_windows: [1, 3, 5]
    promotion_metric: score

  early_stop:
    enabled: true
    patience: 25
    min_delta: 0.01
    plateau_trials: 40

# ============================================================================
# PARAMETERS TO OPTIMIZE
# Keep this set small enough for Successive Halving to be meaningful.
# ============================================================================
parameters:
  # === Risk sizing (portable across instruments) ===
  # 0.003 = 0.3% ... 0.007 = 0.7% (hard cap constant is 0.0075)
  risk.max_risk_per_trade:
    type: float
    range: [0.003, 0.007]
    step: 0.001
    description: "Max risk per trade (fraction of equity). Keep below MAX_RISK_PER_TRADE=0.0075."

  # === SMC confluence weights (small subset) ===
  confluence.weights.structure:
    type: int
    range: [10, 25]
    step: 3
    description: "Weight cap for structure/BOS"

  confluence.weights.liquidity_sweep:
    type: int
    range: [8, 18]
    step: 2
    description: "Weight cap for liquidity sweep"

  confluence.weights.order_block:
    type: int
    range: [10, 20]
    step: 2
    description: "Weight cap for order block"

  confluence.min_score_to_trade:
    type: int
    range: [30, 50]
    step: 5
    description: "Min confluence score to trade"

  session.allow_asian:
    type: categorical
    choices: [true, false]
    description: "Allow Asian session"

  # === TrendFollow core ===
  execution.ltf_bar_minutes:
    type: int
    choices: [3, 5, 15, 30, 60]
    description: "LTF bar aggregation timeframe in minutes (M3/M5/M15/M30/H1)"

  execution.trend_ma_type:
    type: categorical
    choices: ["EMA", "SMA", "WMA", "HMA"]
    description: "Trend MA type"

  execution.trend_sep_ticks_min:
    type: float
    choices: [3.0, 5.0, 8.0, 12.0]
    description: "Minimum EMA separation in ticks for trend direction"

  execution.trend_touch_dist_mult:
    type: float
    choices: [0.3, 0.5, 0.8, 1.0]
    description: "Multiplier for touch distance calculation"

  execution.trend_min_score:
    type: float
    choices: [50.0, 60.0, 70.0, 80.0]
    description: "Minimum signal score threshold for TrendFollow"

  execution.trend_ema_fast:
    type: int
    choices: [10, 20, 30]
    description: "Trend fast MA period"

  execution.trend_ema_slow:
    type: int
    choices: [50, 80, 120]
    description: "Trend slow MA period"

  execution.trend_pullback_require_recross:
    type: categorical
    choices: [true, false]
    description: "Require EMA recross for pullback entries"

  execution.trend_pullback_recross_lookback:
    type: int
    choices: [1, 3, 5]
    description: "Recross lookback bars"

  execution.trend_er_enabled:
    type: categorical
    choices: [true, false]
    description: "Enable Kaufman ER gate for breakouts"

  execution.trend_er_min:
    type: float
    range: [0.20, 0.60]
    step: 0.10
    description: "Minimum ER to allow breakout candidates"

  execution.trend_enable_swing_breakout:
    type: categorical
    choices: [true, false]
    description: "Enable swing breakout variant"

  execution.trend_breakout_entry_buffer_atr_mult:
    type: float
    choices: [0.0, 0.10, 0.20]
    description: "Entry buffer as ATR multiplier (breakouts)"

  execution.trend_breakout_sl_buffer_atr_mult:
    type: float
    choices: [0.15, 0.25, 0.35]
    description: "SL buffer as ATR multiplier (breakouts)"

  # === PSAR alignment filter ===
  execution.psar_enabled:
    type: categorical
    choices: [true, false]
    description: "Enable PSAR alignment filter"

  execution.psar_step:
    type: float
    choices: [0.02, 0.03, 0.04]
    description: "PSAR acceleration step"

  execution.psar_max:
    type: float
    choices: [0.20, 0.25, 0.30]
    description: "PSAR max acceleration"

  # === Mean Reversion (small subset) ===
  execution.mean_revert_bb_period:
    type: int
    choices: [15, 20, 30]
    description: "BB period"

  execution.mean_revert_bb_k:
    type: float
    choices: [1.5, 2.0, 2.5]
    description: "BB k"

  execution.mean_revert_rsi_oversold:
    type: float
    choices: [20.0, 25.0, 30.0]
    description: "RSI oversold"

  execution.mean_revert_rsi_overbought:
    type: float
    choices: [70.0, 75.0, 80.0]
    description: "RSI overbought"

# ============================================================================
# FIXED PARAMETERS (Apex-compliant defaults)
# ============================================================================
fixed:
  # Enable everything at once (unified run)
  execution.enable_smc: true
  execution.enable_trend_follow: true
  execution.trend_follow_mode: "BOTH"
  execution.enable_trend_pullback: true
  execution.enable_trend_breakout: true
  execution.trend_enable_donchian_breakout: true
  execution.enable_mean_revert: true
  # Keep MR reachable in unified selector routing
  execution.force_mean_revert: false

  # Time gates - APEX MANDATORY
  time.cutoff_et: "16:55"
  time.warning_et: "16:00"
  time.urgent_et: "16:30"
  time.emergency_et: "16:55"
  execution.allow_overnight: false

  # Execution safety + realism
  execution.use_session_filter: true
  execution.use_regime_filter: true
  execution.use_mtf: true
  # Auto-derive MTF/HTF timeframes from LTF during optimization.
  # This avoids invalid hierarchy when sweeping `execution.ltf_bar_minutes`.
  execution.mtf_bar_minutes: null
  execution.htf_bar_minutes: null
  execution.use_footprint: false

  # Baseline RR management (can be expanded later)
  execution.min_rr_ratio: 1.5
  execution.target_rr_ratio: 2.5
  execution.atr_multiplier: 1.5  # Default ATR multiplier for SL

  # Risk drawdown buffers
  risk.dd_soft: 0.03
  risk.dd_hard: 0.045

  # Keep footprint score out when disabled
  confluence.footprint_weight: 0

constraints:
  apex:
    trailing_dd_max: 4.5
    daily_profit_max: 29.0
    overnight_positions: 0
    time_gate_violations: 0

  validation:
    wfe_min: 0.6
    sqn_min: 2.0
    psr_min: 0.85
    min_trades: 200
    min_years: 5

  anti_overfit:
    pbo_max: 0.25
    mc95_dd_max: 4.0

objective:
  direction: maximize
  metric: composite

  composite:
    sqn:
      weight: 0.40
      normalize: 5.0
    wfe:
      weight: 0.35
      normalize: 1.0
    consistency:
      weight: 0.25
      source: positive_days_ratio
      normalize: 1.0

  penalties:
    trailing_dd:
      threshold: 3.0
      decay_rate: 0.5
    trades:
      min_required: 200
      penalty_below: 0.5

validation:
  inline_wfa:
    enabled: true
    windows: 5
    is_ratio: 0.8
    purge_days: 5
    embargo_days: 2
    early_prune_wfe: 0.5

  regime_check:
    enabled: false
    regimes: [trend, range, volatile]
    min_coverage: 0.7
    classifier: volatility

stress_test:
  enabled: true
  top_n: 5

  monte_carlo:
    enabled: true
    simulations: 5000
    block_bootstrap: true
    block_size: auto
    confidence_levels: [0.95, 0.99]

  degradation:
    enabled: true
    rates: [0.10, 0.20, 0.30]
    must_survive: 0.20

  ghost_test:
    enabled: false
    sims: 200
    seed_offset: 0
    sharpe_delta_min: 0.5
    p_value_max: 0.05

  overfitting_detection:
    cliff_check: true
    island_check: true
    regime_bias_check: true

data:
  train_range:
    start: "2010-01-01"
    end: "2022-12-31"
  test_range:
    start: "2023-01-01"
    end: "2024-12-31"

output:
  dir: "logs/optimization/all_strategies_fast"
  session_subfolder: true
  reports: [json, csv]

  checkpointing:
    enabled: true
    interval: 20

  streaming:
    results_parquet: null
    flush_every: 50
    max_results_in_ram: 500

  handoff:
    enabled: true
    target_agents: [ORACLE, SENTINEL]
