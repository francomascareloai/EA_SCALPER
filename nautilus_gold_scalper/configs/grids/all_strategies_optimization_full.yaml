# All Strategies Optimization Configuration - FULL MODE
# Unified sweep: SMC + TrendFollow (pullback/breakout/swing) + MeanRevert
# Apex Optimizer (successive_halving)
#
# RAM NOTES (9GB target):
# - Prefer `--quick --feed bars` for screening.
# - If you want stride1-quality bars without loading native ticks into RAM,
#   build M5 bars externally and pass them via `--bars-file`.
#   (Optimizer supports `--bars-file` as of 2025-12-25.)
#
# Data realism notes:
# - Stride20 (tick-sampled) can materially change bar OHLC and outcomes vs stride1.
# - This FULL config focuses on robust ranking under bars mode + WFA.

metadata:
  name: "All Strategies Unified Optimization - Full"
  version: "1.0"
  description: "Robust successive_halving across SMC + TrendFollow + MeanRevert with Apex constraints (RAM-aware)"
  author: "Franco"
  created: "2025-12-25"

search:
  mode: successive_halving
  trials: 144
  sampler: lhs
  parallelism: 3
  timeout_per_trial: 600
  seed: 42

  successive_halving:
    enabled: true
    eta: 3
    # Rung 0: 60d window + 1 WFA fold (cheap filter)
    # Rung 1: 365d window + 3 WFA folds (medium)
    # Rung 2: full window + 5 WFA folds (rigorous)
    window_days: [60, 365, 0]
    wfa_windows: [1, 3, 5]
    promotion_metric: score

  early_stop:
    enabled: true
    patience: 40
    min_delta: 0.01
    plateau_trials: 60

# ============================================================================
# PARAMETERS TO OPTIMIZE
# ============================================================================
# Keep the set moderate; FULL mode increases rung duration and robustness.
parameters:
  # === Risk sizing (portable across instruments) ===
  risk.max_risk_per_trade:
    type: float
    range: [0.002, 0.007]
    step: 0.001
    description: "Max risk per trade (fraction of equity). Hard cap constant is 0.0075."

  # === SMC confluence weights ===
  confluence.weights.structure:
    type: int
    range: [10, 28]
    step: 3

  confluence.weights.liquidity_sweep:
    type: int
    range: [8, 20]
    step: 2

  confluence.weights.order_block:
    type: int
    range: [10, 26]
    step: 2

  confluence.min_score_to_trade:
    type: int
    range: [30, 55]
    step: 5

  # === Session reachability ===
  session.allow_asian:
    type: categorical
    choices: [true, false]

  session.allow_late_ny:
    type: categorical
    choices: [true, false]

  session.friday_close_hour:
    type: int
    choices: [12, 13, 14, 15]

  # === TrendFollow core ===
  execution.ltf_bar_minutes:
    type: int
    choices: [3, 5, 15, 30, 60]
    description: "LTF bar aggregation timeframe in minutes (M3/M5/M15/M30/H1)"

  execution.trend_ma_type:
    type: categorical
    choices: ["EMA", "SMA", "WMA", "HMA"]

  execution.trend_sep_ticks_min:
    type: float
    choices: [3.0, 5.0, 8.0, 12.0, 15.0]
    description: "Minimum EMA separation in ticks for trend direction"

  execution.trend_touch_dist_mult:
    type: float
    choices: [0.3, 0.5, 0.8, 1.0, 1.5]
    description: "Multiplier for touch distance calculation"

  execution.trend_min_score:
    type: float
    choices: [50.0, 60.0, 70.0, 80.0, 90.0]
    description: "Minimum signal score threshold for TrendFollow"

  execution.trend_ema_fast:
    type: int
    choices: [10, 20, 30, 40]

  execution.trend_ema_slow:
    type: int
    choices: [50, 80, 120, 160]

  execution.trend_pullback_require_recross:
    type: categorical
    choices: [true, false]

  execution.trend_pullback_recross_lookback:
    type: int
    choices: [1, 3, 5]

  execution.trend_er_enabled:
    type: categorical
    choices: [true, false]

  execution.trend_er_min:
    type: float
    range: [0.20, 0.60]
    step: 0.10

  execution.trend_enable_swing_breakout:
    type: categorical
    choices: [true, false]

  execution.trend_breakout_entry_buffer_atr_mult:
    type: float
    choices: [0.0, 0.10, 0.20, 0.30]

  execution.trend_breakout_sl_buffer_atr_mult:
    type: float
    choices: [0.15, 0.25, 0.35, 0.45]

  # === PSAR alignment filter ===
  execution.psar_enabled:
    type: categorical
    choices: [true, false]

  execution.psar_step:
    type: float
    choices: [0.02, 0.03, 0.04]

  execution.psar_max:
    type: float
    choices: [0.20, 0.25, 0.30]

  # === Mean Reversion (moderate subset) ===
  execution.mean_revert_bb_period:
    type: int
    choices: [15, 20, 25, 30]

  execution.mean_revert_bb_k:
    type: float
    choices: [1.5, 2.0, 2.5, 3.0]

  execution.mean_revert_rsi_period:
    type: int
    choices: [10, 14, 18]

  execution.mean_revert_rsi_oversold:
    type: float
    choices: [20.0, 25.0, 30.0]

  execution.mean_revert_rsi_overbought:
    type: float
    choices: [70.0, 75.0, 80.0]

# ============================================================================
# FIXED PARAMETERS (Apex-compliant defaults)
# ============================================================================
fixed:
  # Enable everything at once (unified run)
  execution.enable_smc: true
  execution.enable_trend_follow: true
  execution.trend_follow_mode: "BOTH"
  execution.enable_trend_pullback: true
  execution.enable_trend_breakout: true
  execution.trend_enable_donchian_breakout: true
  execution.enable_mean_revert: true
  execution.force_mean_revert: false

  # Time gates - APEX MANDATORY
  time.cutoff_et: "16:55"
  time.warning_et: "16:00"
  time.urgent_et: "16:30"
  time.emergency_et: "16:55"
  execution.allow_overnight: false

  # Execution safety + realism
  execution.use_session_filter: true
  execution.use_regime_filter: true
  execution.use_mtf: true
  # Auto-derive MTF/HTF timeframes from LTF during optimization.
  # This avoids invalid hierarchy when sweeping `execution.ltf_bar_minutes`.
  execution.mtf_bar_minutes: null
  execution.htf_bar_minutes: null
  execution.use_footprint: false

  # Baseline RR management
  execution.min_rr_ratio: 1.5
  execution.target_rr_ratio: 2.5

  # Risk drawdown buffers
  risk.dd_soft: 0.03
  risk.dd_hard: 0.045

  # Keep footprint score out when disabled
  confluence.footprint_weight: 0

constraints:
  apex:
    trailing_dd_max: 4.5
    daily_profit_max: 29.0
    overnight_positions: 0
    time_gate_violations: 0

  validation:
    wfe_min: 0.6
    sqn_min: 2.0
    psr_min: 0.85
    min_trades: 200
    min_years: 5

  anti_overfit:
    pbo_max: 0.25
    mc95_dd_max: 4.0

objective:
  direction: maximize
  metric: composite

  composite:
    sqn:
      weight: 0.40
      normalize: 5.0
    wfe:
      weight: 0.35
      normalize: 1.0
    consistency:
      weight: 0.25
      source: positive_days_ratio
      normalize: 1.0

  penalties:
    trailing_dd:
      threshold: 3.0
      decay_rate: 0.5
    trades:
      min_required: 200
      penalty_below: 0.5

validation:
  inline_wfa:
    enabled: true
    windows: 5
    is_ratio: 0.8
    purge_days: 5
    embargo_days: 2
    early_prune_wfe: 0.5

  regime_check:
    enabled: false
    regimes: [trend, range, volatile]
    min_coverage: 0.7
    classifier: volatility

stress_test:
  enabled: true
  top_n: 5

  monte_carlo:
    enabled: true
    simulations: 5000
    block_bootstrap: true
    block_size: auto
    confidence_levels: [0.95, 0.99]

  degradation:
    enabled: true
    rates: [0.10, 0.20, 0.30]
    must_survive: 0.20

  ghost_test:
    enabled: false
    sims: 200
    seed_offset: 0
    sharpe_delta_min: 0.5
    p_value_max: 0.05

  overfitting_detection:
    cliff_check: true
    island_check: true
    regime_bias_check: true

data:
  train_range:
    start: "2010-01-01"
    end: "2022-12-31"
  test_range:
    start: "2023-01-01"
    end: "2024-12-31"

output:
  dir: "logs/optimization/all_strategies_full"
  session_subfolder: true
  reports: [json, csv]

  checkpointing:
    enabled: true
    interval: 25

  streaming:
    results_parquet: null
    flush_every: 50
    max_results_in_ram: 300

  handoff:
    enabled: true
    target_agents: [ORACLE, SENTINEL]
