version: 1
name: eval20d_full
description: >
  Extremely complete grid for M5 screening. Use --groups + --samples to control runtime.
  Keys are dotpaths merged into `configs/strategy_config.yaml` unless prefixed with runner./run.

default_groups: ["core"]

grid:
  # Baseline (singletons) to keep runs reproducible unless group overrides.
  runner.seed: [42]
  run.use_footprint: [true]
  run.reports: ["positions"]

groups:
  core:
    run.execution_threshold: [50, 55, 60, 65, 70, 75]
    run.risk_per_trade: [0.0025, 0.005, 0.0075, 0.01]
    run.use_session_filter: [false, true]
    run.use_regime_filter: [false, true]
    run.use_mtf: [false, true]
    run.use_news_filter: [false, true]

  rr:
    execution.target_rr_ratio: [1.8, 2.0, 2.2, 2.5, 2.8, 3.0]
    execution.min_rr_ratio: [1.0, 1.2, 1.5, 1.8]
    execution.require_htf_align: [false, true]

  fills:
    # BacktestRunner(...) realism controls (fast to sweep)
    runner.slippage_ticks: [0, 1, 2, 3, 5]
    runner.latency_ms: [0, 25, 50, 75]
    runner.partial_fill_prob: [0.0, 0.05, 0.10, 0.20]
    runner.partial_fill_ratio: [0.25, 0.50, 0.75]

  selector:
    execution.use_selector: [false, true]
    selector.ftmo_safe_mode: [false, true]
    selector.allow_news_trading: [true]
    selector.allow_asian_session: [false, true]
    selector.hurst_trend_threshold: [0.50, 0.52, 0.55, 0.58, 0.60]
    selector.hurst_revert_threshold: [0.30, 0.35, 0.40, 0.45]
    selector.entropy_low_threshold: [1.1, 1.3, 1.5, 1.7, 1.9]
    selector.entropy_high_threshold: [2.1, 2.3, 2.5, 2.7, 2.9]

  session:
    session.allow_asian: [false, true]
    session.allow_late_ny: [false, true]
    session.friday_close_hour: [12, 13, 14, 15]

  regime:
    regime.hurst_period: [60, 80, 100, 120, 140]
    regime.entropy_period: [30, 40, 50, 60, 70]
    regime.vr_period: [10, 20, 30]
    regime.kalman_q: [0.005, 0.01, 0.02]
    regime.kalman_r: [0.05, 0.10, 0.20]
    regime.multiscale_periods:
      - [30, 60, 120]
      - [50, 100, 200]
      - [80, 160, 320]

  structure:
    structure.swing_strength: [2, 3, 4, 5]
    structure.equal_tolerance_pips: [2.0, 3.0, 5.0, 8.0]
    structure.break_buffer_pips: [0.5, 1.0, 2.0, 3.0]
    structure.lookback_bars: [60, 100, 150, 200]
    structure.min_swing_distance: [3, 5, 8, 12]

  order_blocks:
    order_blocks.displacement_threshold_pips: [10, 15, 20, 25, 30]
    order_blocks.volume_threshold: [1.2, 1.5, 2.0, 2.5, 3.0]
    order_blocks.require_structure_break: [false, true]
    order_blocks.max_order_blocks: [20, 50, 80, 120]
    order_blocks.lookback_bars: [30, 50, 80, 120]

  fvg:
    fvg.min_gap_pips: [0.5, 1.0, 2.0, 3.0]
    fvg.max_gap_pips: [20, 40, 60, 80]
    fvg.min_displacement_pips: [8, 12, 15, 20, 25]
    fvg.volume_threshold: [1.2, 1.5, 2.0, 2.5]
    fvg.max_fvgs: [20, 50, 80, 120]
    fvg.expiry_hours: [4, 8, 12, 24, 48]

  sweeps:
    liquidity_sweeps.equal_tolerance_pips: [1.0, 2.0, 3.0, 5.0]
    liquidity_sweeps.min_touches: [2, 3, 4]
    liquidity_sweeps.min_sweep_depth_pips: [2, 3, 5, 8, 12]
    liquidity_sweeps.max_bars_beyond: [1, 2, 3, 5]
    liquidity_sweeps.lookback_bars: [10, 20, 30, 50]
    liquidity_sweeps.swing_strength: [2, 3, 4, 5]

  amd:
    amd.min_accumulation_bars: [10, 15, 20, 30]
    amd.max_accumulation_bars: [40, 60, 80, 120]
    amd.range_atr_max: [1.0, 1.25, 1.5, 1.75, 2.0]
    amd.min_sweep_depth_pips: [2, 3, 5, 8, 12]
    amd.min_displacement_atr: [1.0, 1.25, 1.5, 1.75, 2.0]
    amd.equal_tolerance_pips: [1.0, 2.0, 3.0, 5.0]

  mtf:
    mtf.htf_swing_strength: [3, 5, 7]
    mtf.mtf_swing_strength: [2, 3, 4]
    mtf.ltf_swing_strength: [1, 2, 3]
    mtf.htf_lookback_bars: [60, 100, 150]
    mtf.mtf_lookback_bars: [60, 100, 150]
    mtf.ltf_lookback_bars: [30, 50, 80]

  weights:
    confluence.weights.structure: [12, 15, 18, 22]
    confluence.weights.regime: [6, 10, 14]
    confluence.weights.order_block: [10, 15, 20, 25]
    confluence.weights.fvg: [6, 10, 14]
    confluence.weights.liquidity_sweep: [8, 12, 16, 20]
    confluence.weights.amd_cycle: [6, 10, 14]
    confluence.weights.fib: [0, 6, 10, 14]
    confluence.weights.mtf: [8, 12, 15, 20]
    confluence.weights.footprint: [0, 8, 12, 18, 25]

  footprint:
    footprint.cluster_size: [0.10, 0.25, 0.50, 0.75, 1.00]
    footprint.imbalance_ratio: [1.8, 2.0, 2.5, 3.0, 4.0, 5.0]
    footprint.stacked_min: [1, 2, 3, 4, 5]
    footprint.absorption_threshold: [5, 10, 15, 20, 30]
    footprint.volume_multiplier: [1.2, 1.5, 2.0, 3.0, 4.0]
    footprint.lookback_bars: [5, 10, 20, 40, 80]
    footprint.score_floor: [20, 30, 40, 50, 60]
    footprint.score_cap: [85, 90, 95, 97]

  futures_mgc_scaling:
    # When running product=mgc, treat "pips" more like ticks:
    # - point=0 => use instrument tick size (0.1)
    # - pip_factor=1.0 => pips * point * 1.0 (ticks)
    order_blocks.point: [0.0]
    order_blocks.pip_factor: [1.0]
    fvg.point: [0.0]
    fvg.pip_factor: [1.0]
    liquidity_sweeps.point: [0.0]
    liquidity_sweeps.pip_factor: [1.0]
    amd.point: [0.0]
    amd.pip_factor: [1.0]
