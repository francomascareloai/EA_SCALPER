# Mean Reversion Strategy Optimization Configuration
# Apex Optimizer v1.0
#
# NOTE: MR strategy was falsified for XAUUSD M1 in Round 4 analysis (2024-12-24).
# This config preserved for:
#   1. Future structural redesign attempts
#   2. Higher timeframe testing (H1/H4/Daily)
#   3. Session-restricted/regime-gated hybrid strategies
#
# See: .planning/phases/09-strategy-activation/orchestration/2025-12-24_mr_deep_optimization/FINAL_SYNTHESIS.md

metadata:
  name: "Mean Reversion Parameter Optimization"
  version: "1.0"
  description: "Full parameter sweep for MR strategy (BB + RSI + ADX filter)"
  author: "Franco"
  status: "experimental"
  warning: "MR falsified for M1 - use for research only"

search:
  mode: grid  # Grid search for exhaustive exploration
  parallelism: 4
  timeout_per_trial: 300
  seed: 42

  # Enable successive halving for faster elimination
  successive_halving:
    enabled: true
    eta: 3
    window_days: [90, 365, 0]  # 90d -> 1yr -> full
    wfa_windows: [1, 3, 5]
    promotion_metric: score

  early_stop:
    enabled: true
    patience: 20
    min_delta: 0.01
    plateau_trials: 30

parameters:
  # =====================================================
  # BOLLINGER BANDS PARAMETERS
  # =====================================================
  execution.mean_revert_bb_period:
    type: int
    range: [15, 30]
    step: 5
    description: "BB moving average period (default: 20)"

  execution.mean_revert_bb_k:
    type: float
    range: [1.5, 3.0]
    step: 0.5
    description: "BB standard deviation multiplier (default: 2.0)"

  # =====================================================
  # RSI PARAMETERS
  # =====================================================
  execution.mean_revert_rsi_period:
    type: int
    range: [10, 21]
    step: 7
    description: "RSI calculation period (default: 14)"

  execution.mean_revert_rsi_oversold:
    type: float
    range: [20.0, 35.0]
    step: 5.0
    description: "RSI oversold threshold for LONG signals (default: 30)"

  execution.mean_revert_rsi_overbought:
    type: float
    range: [65.0, 80.0]
    step: 5.0
    description: "RSI overbought threshold for SHORT signals (default: 70)"

  # =====================================================
  # ATR EXIT PARAMETERS (CRITICAL FOR M1)
  # =====================================================
  execution.mean_revert_sl_atr_multiplier:
    type: float
    range: [6.0, 14.0]
    step: 2.0
    description: "Stop Loss as ATR multiple (default: 10x for M1)"

  execution.mean_revert_tp_atr_multiplier:
    type: float
    range: [4.0, 12.0]
    step: 2.0
    description: "Take Profit as ATR multiple (default: 8x for M1)"

  # =====================================================
  # ADX REGIME FILTER (CRITICAL)
  # =====================================================
  execution.mean_revert_adx_period:
    type: int
    range: [10, 21]
    step: 7
    description: "ADX calculation period (default: 14)"

  execution.mean_revert_max_adx:
    type: float
    range: [20.0, 45.0]
    step: 5.0
    description: "Block MR when ADX > threshold (trend too strong)"

  # =====================================================
  # VOLATILITY FILTER
  # =====================================================
  execution.mean_revert_max_atr_percentile:
    type: float
    range: [50.0, 90.0]
    step: 10.0
    description: "Block MR when volatility > Nth percentile"

# =====================================================
# FIXED PARAMETERS (Not Optimized)
# =====================================================
fixed:
  # Strategy mode
  execution.enable_mean_revert: true
  execution.force_mean_revert: true
  execution.enable_trend_pullback: false
  execution.enable_trend_breakout: false

  # Use ATR exits (proven better than swing-based)
  execution.mean_revert_use_atr_exits: true
  execution.mean_revert_use_adx_filter: true

  # Time gates (Apex compliance)
  session.start: "08:00"
  session.end: "16:30"
  time_gate.block_new: "16:30"
  time_gate.force_close: "16:55"

  # Risk limits
  risk.max_positions: 1
  risk.max_risk_pct: 1.0

constraints:
  apex:
    trailing_dd_max: 4.5
    daily_profit_max: 29.0
    overnight_positions: 0
    time_gate_violations: 0

  validation:
    # Relaxed for MR exploration (original falsified at stricter thresholds)
    wfe_min: 0.4
    sqn_min: 1.5
    psr_min: 0.75
    min_trades: 50  # MR has low trade frequency
    min_years: 2

  anti_overfit:
    pbo_max: 0.30
    mc95_dd_max: 4.5

objective:
  direction: maximize
  metric: composite

  composite:
    sqn:
      weight: 0.35
      normalize: 5.0
    wfe:
      weight: 0.35
      normalize: 1.0
    win_rate:
      weight: 0.20
      source: win_rate_pct
      normalize: 100.0
    consistency:
      weight: 0.10
      source: positive_days_ratio
      normalize: 1.0

  penalties:
    trailing_dd:
      threshold: 3.0
      decay_rate: 0.5
    trades:
      min_required: 50
      penalty_below: 0.3
    # Penalty for inverted R:R (critical MR flaw)
    rr_ratio:
      min_required: 0.8  # TP/SL ratio
      penalty_below: 0.4

validation:
  inline_wfa:
    enabled: true
    windows: 5
    is_ratio: 0.8
    purge_days: 5
    embargo_days: 2
    early_prune_wfe: 0.3

  regime_check:
    enabled: false  # Enable for regime-specific analysis
    regimes: [trend, range, volatile]
    min_coverage: 0.7
    classifier: volatility

stress_test:
  enabled: true
  top_n: 5

  monte_carlo:
    enabled: true
    simulations: 3000
    block_bootstrap: true
    block_size: auto
    confidence_levels: [0.95, 0.99]

  degradation:
    enabled: true
    rates: [0.10, 0.20, 0.30]
    must_survive: 0.20

  overfitting_detection:
    cliff_check: true
    island_check: true
    regime_bias_check: true

data:
  path: "data/raw/full_parquet/xauusd_2003_2025_stride20_full.parquet"
  train_range:
    start: "2018-01-01"
    end: "2022-12-31"
  test_range:
    start: "2023-01-01"
    end: "2024-12-31"

output:
  dir: "logs/optimization/mr"
  session_subfolder: true
  reports: [json, csv]

  checkpointing:
    enabled: true
    interval: 10

  handoff:
    enabled: true
    target_agents: [ORACLE, SENTINEL]
