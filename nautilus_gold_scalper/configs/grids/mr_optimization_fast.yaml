# Mean Reversion FAST Parameter Optimization
# Quick exploratory sweep with reduced parameter space
#
# Use this for rapid hypothesis testing before full sweeps.
# Estimated combinations: ~200-500 (fast completion)

metadata:
  name: "Mean Reversion Quick Sweep"
  version: "1.0"
  description: "Fast MR parameter exploration for hypothesis testing"
  author: "Franco"
  status: "experimental"

search:
  mode: grid
  parallelism: 4
  timeout_per_trial: 180
  seed: 42

  successive_halving:
    enabled: true
    eta: 2
    window_days: [90, 0]
    wfa_windows: [1, 3]
    promotion_metric: score

  early_stop:
    enabled: true
    patience: 10
    min_delta: 0.02
    plateau_trials: 20

parameters:
  # Coarse granularity for speed
  execution.mean_revert_bb_period:
    type: int
    choices: [15, 20, 30]
    description: "BB period (3 values)"

  execution.mean_revert_bb_k:
    type: float
    choices: [1.5, 2.0, 2.5]
    description: "BB std dev (3 values)"

  execution.mean_revert_rsi_oversold:
    type: float
    choices: [20.0, 25.0, 30.0]
    description: "RSI oversold (3 values)"

  execution.mean_revert_rsi_overbought:
    type: float
    choices: [70.0, 75.0, 80.0]
    description: "RSI overbought (3 values)"

  execution.mean_revert_max_atr_percentile:
    type: float
    choices: [50.0, 70.0, 90.0]
    description: "ATR percentile filter (3 values)"

  # NOTE: Removed dead params (not implemented in GoldScalperConfig):
  # - execution.mean_revert_sl_atr_multiplier
  # - execution.mean_revert_tp_atr_multiplier
  # - execution.mean_revert_max_adx

fixed:
  execution.enable_mean_revert: true
  execution.force_mean_revert: true
  execution.enable_trend_pullback: false
  execution.enable_trend_breakout: false
  execution.enable_smc: false
  execution.mean_revert_rsi_period: 14

  # Time gates (Apex compliance) - correct dotpaths
  time.cutoff_et: "16:55"
  time.warning_et: "16:00"
  time.urgent_et: "16:30"
  time.emergency_et: "16:55"
  execution.allow_overnight: false

  # Risk limits - correct dotpaths
  execution.max_concurrent_positions: 1
  risk.max_risk_per_trade: 0.01

constraints:
  apex:
    trailing_dd_max: 4.5
    daily_profit_max: 29.0
    overnight_positions: 0
    time_gate_violations: 0

  validation:
    # Compliant with CLAUDE.md validation gates
    wfe_min: 0.6
    sqn_min: 2.0
    psr_min: 0.85
    min_trades: 200
    min_years: 5

  anti_overfit:
    pbo_max: 0.25
    mc95_dd_max: 4.0

objective:
  direction: maximize
  metric: composite

  composite:
    sqn:
      weight: 0.40
      normalize: 5.0
    wfe:
      weight: 0.35
      normalize: 1.0
    win_rate:
      weight: 0.25
      source: win_rate_pct
      normalize: 100.0

  penalties:
    trailing_dd:
      threshold: 3.5
      decay_rate: 0.4
    trades:
      min_required: 200
      penalty_below: 0.4

validation:
  inline_wfa:
    enabled: true
    windows: 3
    is_ratio: 0.8
    purge_days: 3
    embargo_days: 1
    early_prune_wfe: 0.2

stress_test:
  enabled: false  # Skip for fast runs
  top_n: 3

data:
  train_range:
    start: "2020-01-01"
    end: "2023-12-31"
  test_range:
    start: "2024-01-01"
    end: "2024-12-31"

output:
  dir: "logs/optimization/mr_fast"
  session_subfolder: true
  reports: [json, csv]
  checkpointing:
    enabled: true
    interval: 20
  handoff:
    enabled: false
