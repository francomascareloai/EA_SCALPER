# Mean Reversion FAST Parameter Optimization
# Quick exploratory sweep with reduced parameter space
#
# Use this for rapid hypothesis testing before full sweeps.
# Estimated combinations: ~200-500 (fast completion)

metadata:
  name: "Mean Reversion Quick Sweep (RESEARCH - relaxed gates)"
  version: "1.0"
  description: "Fast MR parameter exploration for hypothesis testing"
  author: "Franco"
  status: "research"
  warning: "RELAXED validation gates - NOT COMPLIANT with CLAUDE.md"

search:
  mode: grid
  parallelism: 4
  timeout_per_trial: 180
  seed: 42

  successive_halving:
    enabled: true
    eta: 2
    window_days: [90, 0]
    wfa_windows: [1, 3]
    promotion_metric: score

  early_stop:
    enabled: true
    patience: 10
    min_delta: 0.02
    plateau_trials: 20

parameters:
  # Coarse granularity for speed
  execution.mean_revert_bb_period:
    type: int
    choices: [15, 20, 30]
    description: "BB period (3 values)"

  execution.mean_revert_bb_k:
    type: float
    choices: [1.5, 2.0, 2.5]
    description: "BB std dev (3 values)"

  execution.mean_revert_rsi_oversold:
    type: float
    choices: [20.0, 25.0, 30.0]
    description: "RSI oversold (3 values)"

  execution.mean_revert_rsi_overbought:
    type: float
    choices: [70.0, 75.0, 80.0]
    description: "RSI overbought (3 values)"

  execution.mean_revert_sl_atr_multiplier:
    type: float
    choices: [6.0, 8.0, 10.0, 12.0]
    description: "SL ATR mult (4 values)"

  execution.mean_revert_tp_atr_multiplier:
    type: float
    choices: [4.0, 6.0, 8.0, 10.0]
    description: "TP ATR mult (4 values)"

  execution.mean_revert_max_adx:
    type: float
    choices: [25.0, 30.0, 35.0, 40.0]
    description: "Max ADX (4 values)"

fixed:
  execution.enable_mean_revert: true
  execution.force_mean_revert: true
  execution.enable_trend_pullback: false
  execution.enable_trend_breakout: false
  execution.mean_revert_use_atr_exits: true
  execution.mean_revert_use_adx_filter: true
  execution.mean_revert_rsi_period: 14
  execution.mean_revert_adx_period: 14
  execution.mean_revert_max_atr_percentile: 70.0
  session.start: "08:00"
  session.end: "16:30"
  time_gate.block_new: "16:30"
  time_gate.force_close: "16:55"
  risk.max_positions: 1
  risk.max_risk_pct: 1.0

constraints:
  apex:
    trailing_dd_max: 4.5
    daily_profit_max: 29.0
    overnight_positions: 0
    time_gate_violations: 0

  validation:
    wfe_min: 0.3
    sqn_min: 1.0
    psr_min: 0.65
    min_trades: 20
    min_years: 2

  anti_overfit:
    pbo_max: 0.40
    mc95_dd_max: 5.5

objective:
  direction: maximize
  metric: composite

  composite:
    sqn:
      weight: 0.40
      normalize: 5.0
    wfe:
      weight: 0.35
      normalize: 1.0
    win_rate:
      weight: 0.25
      source: win_rate_pct
      normalize: 100.0

  penalties:
    trailing_dd:
      threshold: 3.5
      decay_rate: 0.4
    trades:
      min_required: 20
      penalty_below: 0.4

validation:
  inline_wfa:
    enabled: true
    windows: 3
    is_ratio: 0.8
    purge_days: 3
    embargo_days: 1
    early_prune_wfe: 0.2

stress_test:
  enabled: false  # Skip for fast runs
  top_n: 3

data:
  train_range:
    start: "2020-01-01"
    end: "2023-12-31"
  test_range:
    start: "2024-01-01"
    end: "2024-12-31"

output:
  dir: "logs/optimization/mr_fast"
  session_subfolder: true
  reports: [json, csv]
  checkpointing:
    enabled: true
    interval: 20
  handoff:
    enabled: false
