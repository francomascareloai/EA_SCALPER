# Mean Reversion FULL Parameter Optimization
# Maximum parameter granularity for exhaustive research
#
# WARNING: This generates a very large parameter space!
# Estimated combinations: ~50,000+
# Use successive_halving to prune efficiently.

metadata:
  name: "Mean Reversion Full Sweep"
  version: "1.0"
  description: "Exhaustive MR parameter exploration with fine granularity"
  author: "Franco"
  status: "research"
  warning: "MR falsified for M1 - use for structural research only"

search:
  mode: bayesian  # Bayesian more efficient for large spaces
  trials: 500
  sampler: tpe
  parallelism: 4
  timeout_per_trial: 300
  seed: 42

  successive_halving:
    enabled: true
    eta: 3
    window_days: [60, 180, 365, 0]
    wfa_windows: [1, 2, 3, 5]
    promotion_metric: score

  early_stop:
    enabled: true
    patience: 50
    min_delta: 0.005
    plateau_trials: 100

parameters:
  # =====================================================
  # BOLLINGER BANDS - FINE GRANULARITY
  # =====================================================
  execution.mean_revert_bb_period:
    type: int
    range: [10, 40]
    step: 2
    description: "BB period: 10-40 (step 2)"

  execution.mean_revert_bb_k:
    type: float
    range: [1.0, 3.5]
    step: 0.25
    description: "BB std dev: 1.0-3.5 (step 0.25)"

  # =====================================================
  # RSI - FINE GRANULARITY
  # =====================================================
  execution.mean_revert_rsi_period:
    type: int
    range: [7, 28]
    step: 3
    description: "RSI period: 7-28 (step 3)"

  execution.mean_revert_rsi_oversold:
    type: float
    range: [15.0, 40.0]
    step: 2.5
    description: "RSI oversold: 15-40 (step 2.5)"

  execution.mean_revert_rsi_overbought:
    type: float
    range: [60.0, 85.0]
    step: 2.5
    description: "RSI overbought: 60-85 (step 2.5)"

  # =====================================================
  # VOLATILITY FILTER - FINE GRANULARITY
  # =====================================================
  execution.mean_revert_max_atr_percentile:
    type: float
    range: [40.0, 95.0]
    step: 5.0
    description: "Max ATR percentile: 40-95 (step 5)"

  # =====================================================
  # NOTE: Removed dead params (not implemented in GoldScalperConfig):
  # - execution.mean_revert_sl_atr_multiplier (ATR-based SL)
  # - execution.mean_revert_tp_atr_multiplier (ATR-based TP)
  # - execution.mean_revert_adx_period (ADX filter)
  # - execution.mean_revert_max_adx (ADX threshold)
  # These are FUTURE ENHANCEMENTS - add to GoldScalperConfig when ready
  # =====================================================

fixed:
  execution.enable_mean_revert: true
  execution.force_mean_revert: true
  execution.enable_trend_pullback: false
  execution.enable_trend_breakout: false
  execution.enable_smc: false

  # Time gates (Apex compliance) - correct dotpaths
  time.cutoff_et: "16:55"
  time.warning_et: "16:00"
  time.urgent_et: "16:30"
  time.emergency_et: "16:55"
  execution.allow_overnight: false

  # Risk limits - correct dotpaths
  execution.max_concurrent_positions: 1
  risk.max_risk_per_trade: 0.01

constraints:
  apex:
    trailing_dd_max: 4.5
    daily_profit_max: 29.0
    overnight_positions: 0
    time_gate_violations: 0

  validation:
    # Compliant with CLAUDE.md validation gates
    wfe_min: 0.6
    sqn_min: 2.0
    psr_min: 0.85
    min_trades: 200
    min_years: 5

  anti_overfit:
    pbo_max: 0.25
    mc95_dd_max: 4.0

objective:
  direction: maximize
  metric: composite

  composite:
    sqn:
      weight: 0.30
      normalize: 5.0
    wfe:
      weight: 0.30
      normalize: 1.0
    win_rate:
      weight: 0.25
      source: win_rate_pct
      normalize: 100.0
    consistency:
      weight: 0.15
      source: positive_days_ratio
      normalize: 1.0

  penalties:
    trailing_dd:
      threshold: 3.0
      decay_rate: 0.5
    trades:
      min_required: 200
      penalty_below: 0.3
    rr_ratio:
      min_required: 0.7
      penalty_below: 0.5

validation:
  inline_wfa:
    enabled: true
    windows: 3
    is_ratio: 0.8
    purge_days: 5
    embargo_days: 2
    early_prune_wfe: 0.25

stress_test:
  enabled: true
  top_n: 10

  monte_carlo:
    enabled: true
    simulations: 2000
    block_bootstrap: true
    block_size: auto
    confidence_levels: [0.95]

  degradation:
    enabled: true
    rates: [0.15, 0.25]
    must_survive: 0.25

data:
  train_range:
    start: "2015-01-01"
    end: "2022-12-31"
  test_range:
    start: "2023-01-01"
    end: "2024-12-31"

output:
  dir: "logs/optimization/mr_full"
  session_subfolder: true
  reports: [json, csv]
  checkpointing:
    enabled: true
    interval: 25
  handoff:
    enabled: true
    target_agents: [ORACLE, SENTINEL]
