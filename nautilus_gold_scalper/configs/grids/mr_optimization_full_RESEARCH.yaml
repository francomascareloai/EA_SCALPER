# RESEARCH-ONLY (RELAXED VALIDATION GATES) - NOT COMPLIANT WITH CLAUDE.md
#
# This file intentionally relaxes optimizer validation gates.
# Use the compliant config instead:
#   /home/franco/projetos/EA_SCALPER_XAUUSD/nautilus_gold_scalper/configs/grids/mr_optimization_full.yaml
# ============================================================================

# Mean Reversion FULL Parameter Optimization
# Maximum parameter granularity for exhaustive research
#
# WARNING: This generates a very large parameter space!
# Estimated combinations: ~50,000+
# Use successive_halving to prune efficiently.

metadata:
  name: "Mean Reversion Full Sweep (RESEARCH - relaxed gates)"
  version: "1.0"
  description: "Exhaustive MR parameter exploration with fine granularity"
  author: "Franco"
  status: "research"
  warning: "RELAXED validation gates - NOT COMPLIANT with CLAUDE.md"

search:
  mode: bayesian  # Bayesian more efficient for large spaces
  trials: 500
  sampler: tpe
  parallelism: 4
  timeout_per_trial: 300
  seed: 42

  successive_halving:
    enabled: true
    eta: 3
    window_days: [60, 180, 365, 0]
    wfa_windows: [1, 2, 3, 5]
    promotion_metric: score

  early_stop:
    enabled: true
    patience: 50
    min_delta: 0.005
    plateau_trials: 100

parameters:
  # =====================================================
  # BOLLINGER BANDS - FINE GRANULARITY
  # =====================================================
  execution.mean_revert_bb_period:
    type: int
    range: [10, 40]
    step: 2
    description: "BB period: 10-40 (step 2)"

  execution.mean_revert_bb_k:
    type: float
    range: [1.0, 3.5]
    step: 0.25
    description: "BB std dev: 1.0-3.5 (step 0.25)"

  # =====================================================
  # RSI - FINE GRANULARITY
  # =====================================================
  execution.mean_revert_rsi_period:
    type: int
    range: [7, 28]
    step: 3
    description: "RSI period: 7-28 (step 3)"

  execution.mean_revert_rsi_oversold:
    type: float
    range: [15.0, 40.0]
    step: 2.5
    description: "RSI oversold: 15-40 (step 2.5)"

  execution.mean_revert_rsi_overbought:
    type: float
    range: [60.0, 85.0]
    step: 2.5
    description: "RSI overbought: 60-85 (step 2.5)"

  # =====================================================
  # ATR EXITS - FINE GRANULARITY
  # =====================================================
  execution.mean_revert_sl_atr_multiplier:
    type: float
    range: [4.0, 16.0]
    step: 1.0
    description: "SL ATR mult: 4-16 (step 1)"

  execution.mean_revert_tp_atr_multiplier:
    type: float
    range: [3.0, 14.0]
    step: 1.0
    description: "TP ATR mult: 3-14 (step 1)"

  # =====================================================
  # ADX FILTER - FINE GRANULARITY
  # =====================================================
  execution.mean_revert_adx_period:
    type: int
    range: [7, 28]
    step: 7
    description: "ADX period: 7, 14, 21, 28"

  execution.mean_revert_max_adx:
    type: float
    range: [15.0, 50.0]
    step: 2.5
    description: "Max ADX: 15-50 (step 2.5)"

  # =====================================================
  # VOLATILITY FILTER - FINE GRANULARITY
  # =====================================================
  execution.mean_revert_max_atr_percentile:
    type: float
    range: [40.0, 95.0]
    step: 5.0
    description: "Max ATR percentile: 40-95 (step 5)"

fixed:
  execution.enable_mean_revert: true
  execution.force_mean_revert: true
  execution.enable_trend_pullback: false
  execution.enable_trend_breakout: false
  execution.mean_revert_use_atr_exits: true
  execution.mean_revert_use_adx_filter: true
  session.start: "08:00"
  session.end: "16:30"
  time_gate.block_new: "16:30"
  time_gate.force_close: "16:55"
  risk.max_positions: 1
  risk.max_risk_pct: 1.0

constraints:
  apex:
    trailing_dd_max: 4.5
    daily_profit_max: 29.0
    overnight_positions: 0
    time_gate_violations: 0

  validation:
    wfe_min: 0.35
    sqn_min: 1.0
    psr_min: 0.70
    min_trades: 30
    min_years: 2

  anti_overfit:
    pbo_max: 0.35
    mc95_dd_max: 5.0

objective:
  direction: maximize
  metric: composite

  composite:
    sqn:
      weight: 0.30
      normalize: 5.0
    wfe:
      weight: 0.30
      normalize: 1.0
    win_rate:
      weight: 0.25
      source: win_rate_pct
      normalize: 100.0
    consistency:
      weight: 0.15
      source: positive_days_ratio
      normalize: 1.0

  penalties:
    trailing_dd:
      threshold: 3.0
      decay_rate: 0.5
    trades:
      min_required: 30
      penalty_below: 0.3
    rr_ratio:
      min_required: 0.7
      penalty_below: 0.5

validation:
  inline_wfa:
    enabled: true
    windows: 3
    is_ratio: 0.8
    purge_days: 5
    embargo_days: 2
    early_prune_wfe: 0.25

stress_test:
  enabled: true
  top_n: 10

  monte_carlo:
    enabled: true
    simulations: 2000
    block_bootstrap: true
    block_size: auto
    confidence_levels: [0.95]

  degradation:
    enabled: true
    rates: [0.15, 0.25]
    must_survive: 0.25

data:
  path: "data/raw/full_parquet/xauusd_2003_2025_stride20_full.parquet"
  train_range:
    start: "2015-01-01"
    end: "2022-12-31"
  test_range:
    start: "2023-01-01"
    end: "2024-12-31"

output:
  dir: "logs/optimization/mr_full"
  session_subfolder: true
  reports: [json, csv]
  checkpointing:
    enabled: true
    interval: 25
  handoff:
    enabled: true
    target_agents: [ORACLE, SENTINEL]
