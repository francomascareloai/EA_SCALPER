# SMC Strategy Optimization Configuration - FAST MODE
# Apex Optimizer v1.1
# Optimized for successive_halving with expanded parameter coverage

metadata:
  name: "SMC Confluence Optimization - Fast"
  version: "1.1"
  description: "Extended parameter search with fast successive_halving (eta=4, 2 rungs)"
  author: "Franco"
  created: "2025-12-24"

search:
  mode: successive_halving
  trials: 64  # Must be power of eta for clean halving (64 -> 16 -> final)
  sampler: lhs  # Latin Hypercube Sampling for better coverage
  parallelism: 4
  timeout_per_trial: 300
  seed: 42

  # Fast Successive Halving (2 rungs only)
  # Rung 0: 30-day rolling window, 1 WFA fold (cheap filter)
  # Rung 1: Full data, 5 WFA folds (rigorous validation)
  # 64 trials -> 64 + 16 = 80 evals, ~21 equivalent full runs (75% faster)
  successive_halving:
    enabled: true
    eta: 4
    window_days: [30, 0]
    wfa_windows: [1, 5]
    promotion_metric: score

  early_stop:
    enabled: true
    patience: 20
    min_delta: 0.01
    plateau_trials: 30

# ============================================================================
# PARAMETERS TO OPTIMIZE (11 total - expanded from 6)
# ============================================================================
# These paths match strategy_config.yaml structure exactly.
# _deep_update merges nested dicts, build_strategy_config extracts values.
#
# Cardinalities: 6*6*5*5*3*5*5*6*2*4 = 1,080,000 combinations
# With successive_halving (64 trials, eta=4): 64+16=80 evals ~21 full runs
parameters:

  # === CONFLUENCE WEIGHTS (3 params) ===
  # Path: confluence.weights.X -> extracted by _weight() helper
  confluence.weights.structure:
    type: int
    range: [10, 25]
    step: 3
    description: "Weight for structure/BOS signals (6 values: 10,13,16,19,22,25)"

  confluence.weights.liquidity_sweep:
    type: int
    range: [8, 18]
    step: 2
    description: "Weight for liquidity sweep signals (6 values)"

  confluence.weights.order_block:
    type: int
    range: [10, 20]
    step: 2
    description: "Weight for order block signals (5 values: 10,12,14,16,18,20)"

  # === CONFLUENCE THRESHOLDS (2 params) ===
  # Path: confluence.min_score_to_trade / confluence.execution_threshold
  confluence.min_score_to_trade:
    type: int
    range: [30, 50]
    step: 5
    description: "Min confluence score to trigger entry (5 values: 30,35,40,45,50)"

  # NOTE: execution_threshold should track min_score_to_trade
  # We'll set it equal in fixed to avoid conflicting optimization
  # (optimizing both independently can create unreachable configurations)

  # === EXECUTION PARAMETERS (2 params) ===
  # Path: execution.X (via exec_cfg)
  execution.atr_multiplier:
    type: float
    range: [1.5, 2.5]
    step: 0.5
    description: "ATR multiplier for SL distance (3 values: 1.5, 2.0, 2.5)"

  execution.tp_ratio:
    type: float
    range: [1.5, 2.5]
    step: 0.25
    description: "Risk:Reward ratio for TP (5 values: 1.5, 1.75, 2.0, 2.25, 2.5)"

  # NOTE: min_rr_ratio is in BaseStrategyConfig, not exposed in build_strategy_config
  # Removed to prevent runtime errors

  # === RISK PARAMETERS (1 param) ===
  # Path: risk.max_risk_per_trade
  risk.max_risk_per_trade:
    type: float
    range: [0.003, 0.008]
    step: 0.001
    description: "Max risk per trade as decimal (6 values: 0.3% to 0.8%)"

  # === SESSION FILTER (1 param) ===
  # Path: session.allow_asian
  session.allow_asian:
    type: categorical
    choices: [true, false]
    description: "Allow trading during Asian session (2 values)"

  # === STRUCTURE DETECTION (1 param) ===
  # Path: structure.swing_strength -> maps to structure_swing_strength
  structure.swing_strength:
    type: int
    range: [2, 5]
    step: 1
    description: "Swing detection strength (4 values: 2,3,4,5)"

# ============================================================================
# FIXED PARAMETERS (not optimized, Apex-compliant defaults)
# ============================================================================
fixed:
  # Time gates - APEX MANDATORY
  time.cutoff_et: "16:55"
  time.warning_et: "16:00"
  time.urgent_et: "16:30"
  time.emergency_et: "16:55"

  # Risk limits - Conservative
  risk.dd_soft: 0.03
  risk.dd_hard: 0.045  # Buffer before 5% Apex limit

  # Execution safety
  execution.allow_overnight: false
  execution.use_session_filter: true
  execution.use_regime_filter: true
  execution.use_mtf: true

  # Footprint disabled (no real volume in backtest data)
  execution.use_footprint: false
  confluence.footprint_weight: 0

# ============================================================================
# CONSTRAINTS (Apex compliance + validation gates)
# ============================================================================
constraints:
  apex:
    trailing_dd_max: 4.5      # 0.5% buffer before 5% Apex kill
    daily_profit_max: 29.0    # 1% buffer before 30% consistency rule
    overnight_positions: 0    # MANDATORY: no overnight
    time_gate_violations: 0   # MANDATORY: close before cutoff

  validation:
    wfe_min: 0.6              # Walk-forward efficiency
    sqn_min: 2.0              # System quality number
    psr_min: 0.85             # Probabilistic Sharpe ratio
    min_trades: 200           # Statistical significance
    min_years: 5              # Multiple market cycles

  anti_overfit:
    pbo_max: 0.25             # Probability of backtest overfitting
    mc95_dd_max: 4.0          # 95th percentile DD under Monte Carlo

# ============================================================================
# OBJECTIVE FUNCTION
# ============================================================================
objective:
  direction: maximize
  metric: composite

  composite:
    sqn:
      weight: 0.40
      normalize: 5.0
    wfe:
      weight: 0.35
      normalize: 1.0
    consistency:
      weight: 0.25
      source: positive_days_ratio
      normalize: 1.0

  penalties:
    trailing_dd:
      threshold: 3.0
      decay_rate: 0.5
    trades:
      min_required: 200
      penalty_below: 0.5

# ============================================================================
# VALIDATION (inline WFA)
# ============================================================================
validation:
  inline_wfa:
    enabled: true
    windows: 5
    is_ratio: 0.8
    purge_days: 5
    embargo_days: 2
    early_prune_wfe: 0.5

  regime_check:
    enabled: false  # Can enable later for regime-specific validation
    regimes: [trend, range, volatile]
    min_coverage: 0.7
    classifier: volatility

# ============================================================================
# STRESS TEST (for top candidates only)
# ============================================================================
stress_test:
  enabled: true
  top_n: 5

  monte_carlo:
    enabled: true
    simulations: 5000
    block_bootstrap: true
    block_size: auto
    confidence_levels: [0.95, 0.99]

  degradation:
    enabled: true
    rates: [0.10, 0.20, 0.30]
    must_survive: 0.20

  overfitting_detection:
    cliff_check: true
    island_check: true
    regime_bias_check: true

# ============================================================================
# DATA
# ============================================================================
data:
  path: "data/raw/full_parquet/xauusd_2003_2025_stride20_full.parquet"
  train_range:
    start: "2010-01-01"
    end: "2022-12-31"
  test_range:
    start: "2023-01-01"
    end: "2024-12-31"

# ============================================================================
# OUTPUT
# ============================================================================
output:
  dir: "logs/optimization"
  session_subfolder: true
  reports: [json, csv]

  checkpointing:
    enabled: true
    interval: 10

  handoff:
    enabled: true
    target_agents: [ORACLE, SENTINEL]
