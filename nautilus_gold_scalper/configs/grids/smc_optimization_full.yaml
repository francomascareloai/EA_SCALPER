# SMC Strategy Optimization Configuration - FULL MODE
# Apex Optimizer v1.1
# Designed for robust successive_halving (3 rungs) + larger trial budget.

metadata:
  name: "SMC Confluence Optimization - Full"
  version: "1.1"
  description: "Robust successive_halving (eta=4, 3 rungs) + higher trial budget for stable selection"
  author: "Franco"
  created: "2025-12-25"

search:
  mode: successive_halving
  trials: 256
  sampler: lhs
  parallelism: 8
  timeout_per_trial: 600
  seed: 42

  # Robust Successive Halving (3 rungs)
  # Rung 0: 90-day rolling window, 1 WFA fold (cheap filter)
  # Rung 1: 365-day rolling window, 3 WFA folds (medium)
  # Rung 2: Full data, 5 WFA folds (rigorous validation)
  successive_halving:
    enabled: true
    eta: 4
    window_days: [90, 365, 0]
    wfa_windows: [1, 3, 5]
    promotion_metric: score

  early_stop:
    enabled: true
    patience: 40
    min_delta: 0.01
    plateau_trials: 60

# ============================================================================
# PARAMETERS TO OPTIMIZE
# ============================================================================
# Paths match strategy_config.yaml structure.
parameters:
  confluence.weights.structure:
    type: int
    range: [10, 25]
    step: 3

  confluence.weights.liquidity_sweep:
    type: int
    range: [8, 18]
    step: 2

  confluence.weights.order_block:
    type: int
    range: [10, 20]
    step: 2

  confluence.min_score_to_trade:
    type: int
    range: [30, 55]
    step: 5

  execution.atr_multiplier:
    type: float
    range: [1.25, 2.75]
    step: 0.25

  execution.tp_ratio:
    type: float
    range: [1.5, 3.0]
    step: 0.25

  risk.max_risk_per_trade:
    type: float
    range: [0.002, 0.010]
    step: 0.001

  session.allow_asian:
    type: categorical
    choices: [true, false]

  structure.swing_strength:
    type: int
    range: [2, 6]
    step: 1

# ============================================================================
# FIXED PARAMETERS (Apex-compliant defaults)
# ============================================================================
fixed:
  time.cutoff_et: "16:55"
  time.warning_et: "16:00"
  time.urgent_et: "16:30"
  time.emergency_et: "16:55"

  risk.dd_soft: 0.03
  risk.dd_hard: 0.045

  execution.allow_overnight: false
  execution.use_session_filter: true
  execution.use_regime_filter: true
  execution.use_mtf: true

  execution.use_footprint: false
  confluence.footprint_weight: 0

# ============================================================================
# CONSTRAINTS
# ============================================================================
constraints:
  apex:
    trailing_dd_max: 4.5
    daily_profit_max: 29.0
    overnight_positions: 0
    time_gate_violations: 0

  validation:
    wfe_min: 0.6
    sqn_min: 2.0
    psr_min: 0.85
    min_trades: 200
    min_years: 5

  anti_overfit:
    pbo_max: 0.25
    mc95_dd_max: 4.0

# ============================================================================
# OBJECTIVE
# ============================================================================
objective:
  direction: maximize
  metric: composite

  composite:
    sqn:
      weight: 0.40
      normalize: 5.0
    wfe:
      weight: 0.35
      normalize: 1.0
    consistency:
      weight: 0.25
      source: positive_days_ratio
      normalize: 1.0

  penalties:
    trailing_dd:
      threshold: 3.0
      decay_rate: 0.5
    trades:
      min_required: 200
      penalty_below: 0.5

# ============================================================================
# VALIDATION
# ============================================================================
validation:
  inline_wfa:
    enabled: true
    windows: 5
    is_ratio: 0.8
    purge_days: 5
    embargo_days: 2
    early_prune_wfe: 0.5

# ============================================================================
# STRESS TEST
# ============================================================================
stress_test:
  enabled: true
  top_n: 10

  monte_carlo:
    enabled: true
    simulations: 10000
    block_bootstrap: true
    block_size: auto
    confidence_levels: [0.95, 0.99]

  degradation:
    enabled: true
    rates: [0.10, 0.20, 0.30]
    must_survive: 0.20

  ghost_test:
    enabled: false
    sims: 200
    seed_offset: 0
    sharpe_delta_min: 0.5
    p_value_max: 0.05

# ============================================================================
# DATA
# ============================================================================
data:
  path: "data/raw/full_parquet/xauusd_2003_2025_stride20_full.parquet"
  train_range:
    start: "2010-01-01"
    end: "2022-12-31"
  test_range:
    start: "2023-01-01"
    end: "2024-12-31"

# ============================================================================
# OUTPUT
# ============================================================================
output:
  dir: "logs/optimization"
  session_subfolder: true
  reports: [json, csv]

  checkpointing:
    enabled: true
    interval: 10

  handoff:
    enabled: true
    target_agents: [ORACLE, SENTINEL]
