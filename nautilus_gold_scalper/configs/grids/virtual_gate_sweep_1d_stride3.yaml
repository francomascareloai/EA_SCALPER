# 1-day quick sweep for VirtualGate (Phase 11)
# Purpose: sanity-check that sweeping VirtualGate parameters changes behavior/metrics.
# Fast run: uses short window and light stress tests.

metadata:
  name: "VirtualGate 1D Sweep (stride3)"
  version: "1.0"
  description: "One-day smoke sweep to verify VirtualGate configs produce measurable differences"
  author: "Franco"
  created: "2025-12-25"

search:
  mode: grid
  parallelism: 4
  timeout_per_trial: 120
  seed: 42
  max_grid_size: 10000

parameters:
  execution.virtual_gate_enabled:
    type: categorical
    choices: [true, false]

  execution.virtual_gate_lookback_bars:
    type: int
    choices: [10, 20, 30]

  execution.virtual_gate_range_spike_multiplier:
    type: float
    choices: [2.0, 2.5, 3.0, 3.5, 4.0]

  execution.virtual_gate_cluster_spike_multiplier:
    type: float
    choices: [2.0, 2.25, 2.5, 2.75, 3.0]

  execution.virtual_gate_cluster_max_fraction:
    type: float
    choices: [0.15, 0.20, 0.25, 0.30, 0.35]

fixed:
  execution.virtual_gate_fail_open_on_insufficient_history: true

  # Backtest realism
  execution.fill_model: "realistic"
  execution.slippage_ticks: 5
  execution.latency_ms: 0

  # Keep strategy stable
  execution.execution_threshold: 35

  # 1-day-ish range
  data.train_range:
    start: "2024-01-02"
    end: "2024-01-03"
  data.test_range:
    start: "2024-01-02"
    end: "2024-01-03"

objective:
  direction: maximize
  metric: composite

  composite:
    sharpe:
      weight: 0.40
      normalize: 3.0
    sqn:
      weight: 0.30
      normalize: 3.0
    pnl:
      weight: 0.30
      source: total_pnl
      normalize: 500.0

constraints:
  apex:
    trailing_dd_max: 4.5
    daily_profit_max: 29.0
    overnight_positions: 0
    time_gate_violations: 0

output:
  dir: "logs/optimization/virtual_gate_sweep_1d_stride3"
  session_subfolder: true
  reports: [json, csv]
