confluence:
  min_score_to_trade: 35  # FORGE recommended: after removing -10 penalty + scale 6.0
  execution_threshold: 35  # FORGE recommended: matches expected score distribution
  footprint_weight: 0  # DISABLED - not reliable without real order flow data
  fib_weight: 10
  # New-style confluence weight caps (0-100) used by ConfluenceScorer.
  # These are NOT necessarily normalized; they act as max contribution per factor.
  weights:
    structure: 15
    regime: 10
    liquidity_sweep: 12
    amd_cycle: 10
    order_block: 15
    fvg: 10
    fib: 10
    mtf: 15
    footprint: 0  # DISABLED - Dukascopy data has no real volume/order flow
  session_weights:
    asian: null
    london: null
    ny_overlap: null
    ny: null
# Footprint is DISABLED by default for backtesting.
# Dukascopy forex data does not have real order flow (volume is tick count, not transactions).
# Enable ONLY for live trading with real Level 2 data from Rithmic/Tradovate.
footprint:
  cluster_size: 0.5
  tick_size: 0.01
  imbalance_ratio: 3.0
  stacked_min: 3
  absorption_threshold: 15.0
  volume_multiplier: 2.0
  lookback_bars: 20
  stack_decay_30m: 0.75
  stack_decay_60m: 0.5
  score_floor: 40.0
  score_cap: 95.0
fibonacci:
  enabled: true
  use_levels:
  - 0.382
  - 0.5
  - 0.618
  tp_ext:
  - 1.272
  - 1.618
  - 2.0
spread:
  warning_ratio: 2.0
  block_ratio: 5.0
  urgency_threshold: 0.8
risk:
  max_risk_per_trade: 0.005  # Reduced from 0.01 to 0.5% per trade (Oracle finding: $2300 single-trade losses)
  dd_soft: 0.03
  dd_hard: 0.05
  kelly_fraction: 0.25
news:
  enabled: true
  score_penalty: -15
  size_multiplier: 0.5
  # Optional local file to load economic events (CSV/JSON).
  # CSV schema: time_utc,event_name,currency,impact,buffer_before_min,buffer_after_min
  # Example path: nautilus_gold_scalper/data/raw/news_events_2020_today.csv
  # HF ForexFactory: use only the validated USD subset produced by scripts/data/validate_hf_forex_factory_calendar.py
  events_path: nautilus_gold_scalper/data/raw/forex_factory_calendar_usd_top_movers_validated.csv
execution:
  execution_threshold: 35  # FORGE recommended: matches confluence threshold

  # Timeframe controls (minutes)
  # - LTF is the bar interval used for entries (runner uses --ltf-minutes; keep consistent)
  # - MTF/HTF feed the multi-timeframe analysis component (structure/direction)
  # - management_bar_minutes rate-limits trade management (0 = every tick)
  ltf_bar_minutes: 15
  mtf_bar_minutes: 30
  htf_bar_minutes: 60
  management_bar_minutes: 60
  slippage_ticks: 2
  slippage_multiplier: 1.5
  latency_ms: 50
  # Commission per side (USD) for 1 lot/contract.
  # commission_source=schedule only works for MGC (Apex futures).
  # For XAUUSD (forex/CFD simulation), use manual with commission_per_contract.
  commission_source: manual  # manual | schedule (schedule only for MGC)
  commission_profile: apex    # apex | ftmo
  commission_gateway: tradovate  # tradovate | rithmic
  commission_per_contract: 2.5  # Used when commission_source=manual
  fill_model: realistic
  allow_overnight: false
  partial_fill_prob: 0.1
  partial_fill_ratio: 0.5
  fill_reject_base: 0.02
  fill_reject_spread_factor: 0.05
  max_spread_points: 80
  use_selector: false
  use_session_filter: true   # ENABLED: Oracle finding - trades during bad sessions
  use_regime_filter: true    # ENABLED: Oracle finding - trades against regime
  require_htf_align: false
  use_mtf: true
  use_footprint: false  # DISABLED - not reliable for backtest (Dukascopy has no real volume)

  # Phase 11 Safety Layer (VirtualGate)
  virtual_gate_enabled: true
  virtual_gate_lookback_bars: 20
  virtual_gate_range_spike_multiplier: 3.0
  virtual_gate_cluster_spike_multiplier: 2.5
  virtual_gate_cluster_max_fraction: 0.30
  virtual_gate_fail_open_on_insufficient_history: true

  # Phase 11 Safety Layer (existing)
  max_concurrent_positions: 1
  max_concurrent_instruments: 1
  vol_spacing_min_seconds: 0.0
  vol_spacing_max_seconds: 300.0
  vol_spacing_reference_atr: 1.0
spread_monitor:
  history_size: 200
  warning_ratio: 2.0
  block_ratio: 5.0
  max_spread_pips: 45.0
  update_interval: 1
  pip_factor: 10.0
time:
  cutoff_et: '16:59'
  warning_et: '16:00'
  urgent_et: '16:30'
  emergency_et: '16:55'
session:
  broker_gmt_offset: 0
  # FORGE-NAUTILUS Wave 2: Enable for backtest exploration (signal starvation fix)
  allow_asian: true
  allow_late_ny: true
  friday_close_hour: 14
structure:
  swing_strength: 3
  equal_tolerance_pips: 5.0
  break_buffer_pips: 2.0
  lookback_bars: 100
  min_swing_distance: 5
  point: 0.0  # 0 => use instrument tick size
order_blocks:
  displacement_threshold_pips: 20.0
  volume_threshold: 1.5
  require_structure_break: true
  max_order_blocks: 50
  lookback_bars: 50
  point: 0.0  # 0 => use instrument tick size
  pip_factor: 10.0
fvg:
  min_gap_pips: 1.0
  max_gap_pips: 40.0
  min_displacement_pips: 15.0
  volume_threshold: 1.5
  max_fvgs: 50
  expiry_hours: 24
  point: 0.0  # 0 => use instrument tick size
  pip_factor: 10.0
liquidity_sweeps:
  equal_tolerance_pips: 3.0
  min_touches: 2
  min_sweep_depth_pips: 5.0
  max_bars_beyond: 3
  lookback_bars: 20
  swing_strength: 3
  point: 0.0  # 0 => use instrument tick size
  pip_factor: 10.0
amd:
  min_accumulation_bars: 15
  max_accumulation_bars: 80
  range_atr_max: 1.5
  min_sweep_depth_pips: 5.0
  min_displacement_atr: 1.5
  equal_tolerance_pips: 3.0
  point: 0.0  # 0 => use instrument tick size
  pip_factor: 10.0
mtf:
  htf_swing_strength: 5
  mtf_swing_strength: 3
  ltf_swing_strength: 2
  htf_lookback_bars: 100
  mtf_lookback_bars: 100
  ltf_lookback_bars: 50
  structure_point: 0.0  # 0 => use instrument tick size
circuit_breaker:
  level_1_losses: 3
  level_2_losses: 5
  level_3_dd: 3.0
  level_4_dd: 4.0
  level_5_dd: 4.5
  cooldown_minutes:
    level_1: 5
    level_2: 15
    level_3: 30
    level_4: 1440
  size_multipliers:
    level_2: 0.75
    level_3: 0.5
  auto_recovery: true
consistency:
  daily_profit_cap_pct: 30.0
telemetry:
  enabled: true
  path: logs/telemetry.jsonl
  capture:
    spread: true
    circuit: true
    cutoff: true
    metrics: true
ml:
  capture_enabled: false
  filter_enabled: false
  filter_mode: log_only
  filter_min_p_edge: 0.55
  filter_model_path: null
