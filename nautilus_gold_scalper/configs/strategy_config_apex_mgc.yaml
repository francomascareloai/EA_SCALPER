################################################################################
# APEX / MGC (Futures) profile for Nautilus Gold Scalper
#
# Goal:
# - Apex-first: survival + consistency > anything
# - Enable TrendFollow + Adaptive router (EV in R-multiples, with DD penalty)
#
# How to run:
#   .venv/bin/python nautilus_gold_scalper/scripts/backtest/run_backtest.py \
#     --product mgc --gateway tradovate \
#     --config nautilus_gold_scalper/configs/strategy_config_apex_mgc.yaml \
#     --start 2024-11-01 --end 2024-11-07 --feed bars
#
# Notes:
# - This file does NOT change your default config. It's a dedicated profile.
# - Router/TrendFollow are disabled by default in the main config; enabled here.
################################################################################

confluence:
  # FORGE-NAUTILUS CALIBRATION: Reduced from 70 to 55 to address signal starvation.
  # Wave 1 thresholds were too restrictive (only 1 trade in 3 months).
  # 55 is still conservative but allows valid B-tier signals through.
  min_score_to_trade: 55
  execution_threshold: 55
  footprint_weight: 10
  fib_weight: 10
  weights:
    structure: 15
    regime: 10
    liquidity_sweep: 12
    amd_cycle: 10
    order_block: 15
    fvg: 10
    fib: 10
    mtf: 15
    footprint: 10
  session_weights:
    asian: null
    london: null
    ny_overlap: null
    ny: null

footprint:
  cluster_size: 0.5
  tick_size: 0.1  # MGC tick
  imbalance_ratio: 3.0
  stacked_min: 3
  absorption_threshold: 15.0
  volume_multiplier: 2.0
  lookback_bars: 20
  stack_decay_30m: 0.75
  stack_decay_60m: 0.5
  score_floor: 40.0
  score_cap: 95.0

fibonacci:
  enabled: true
  use_levels: [0.382, 0.5, 0.618]
  tp_ext: [1.272, 1.618, 2.0]

spread:
  warning_ratio: 2.0
  block_ratio: 5.0
  urgency_threshold: 0.8

risk:
  # Max risk per trade as fraction of equity (0.005 = 0.5%).
  max_risk_per_trade: 0.005
  # Daily drawdown (fraction). Use 3% as hard daily stop for Apex discipline.
  dd_soft: 0.03
  # Total trailing DD safety buffer (fraction). Apex is 5%; use 4% internal cap.
  dd_hard: 0.04
  kelly_fraction: 0.25

execution:
  # Must match confluence execution_threshold (runner overwrites runtime threshold too).
  # FORGE-NAUTILUS CALIBRATION: Reduced from 70 to 55 (sync with confluence section).
  execution_threshold: 55

  # Trading mode toggles (Apex-first)
  use_selector: true
  use_session_filter: true
  use_regime_filter: true
  require_htf_align: true
  use_mtf: true
  use_footprint: true

  # TrendFollow + Router (NEW)
  enable_trend_follow: true
  enable_trend_pullback: true
  enable_trend_breakout: true

  # Router learns EV in R-multiples and penalizes drawdown.
  router_adaptive_ev: true
  router_min_trades_to_trust: 30
  router_score_weight: 0.10
  router_dd_penalty_total: 0.20
  router_dd_penalty_daily: 0.10

  # Execution realism
  slippage_ticks: 2
  slippage_multiplier: 1.5
  latency_ms: 50
  # Commission is derived from schedule (Apex + gateway), unless overridden via CLI.
  commission_source: schedule
  commission_profile: apex
  commission_gateway: tradovate
  commission_per_contract: 0.0  # ignored when commission_source=schedule
  fill_model: realistic
  partial_fill_prob: 0.1
  partial_fill_ratio: 0.5
  fill_reject_base: 0.02
  fill_reject_spread_factor: 0.05
  max_spread_points: 80
  allow_overnight: false

spread_monitor:
  history_size: 200
  warning_ratio: 2.0
  block_ratio: 5.0
  max_spread_pips: 45.0
  update_interval: 1
  pip_factor: 10.0

time:
  # Apex: close all by 4:59 PM ET. We keep a safety buffer.
  cutoff_et: "16:55"
  warning_et: "16:00"
  urgent_et: "16:30"
  emergency_et: "16:55"

session:
  broker_gmt_offset: 0
  # FORGE-NAUTILUS: Enable Asian for backtest exploration (signal starvation fix)
  allow_asian: true
  allow_late_ny: true
  friday_close_hour: 14

# FORGE-NAUTILUS: Selector thresholds widened to reduce random-walk blocking
# Old: hurst_trend 0.55, hurst_revert 0.40 -> ~40-60% block rate
# New: hurst_trend 0.58, hurst_revert 0.35 -> narrower "random" band
selector:
  hurst_trend_threshold: 0.58
  hurst_revert_threshold: 0.35
  entropy_low_threshold: 1.5
  entropy_high_threshold: 2.5
  allow_asian_session: true
  allow_news_trading: true
  ftmo_safe_mode: false

structure:
  swing_strength: 3
  equal_tolerance_pips: 5.0
  break_buffer_pips: 2.0
  lookback_bars: 100
  min_swing_distance: 5
  point: 0.0

order_blocks:
  displacement_threshold_pips: 20.0
  volume_threshold: 1.5
  require_structure_break: true
  max_order_blocks: 50
  lookback_bars: 50
  point: 0.0
  pip_factor: 10.0

fvg:
  min_gap_pips: 1.0
  max_gap_pips: 40.0
  min_displacement_pips: 15.0
  volume_threshold: 1.5
  max_fvgs: 50
  expiry_hours: 24
  point: 0.0
  pip_factor: 10.0

liquidity_sweeps:
  equal_tolerance_pips: 3.0
  min_touches: 2
  min_sweep_depth_pips: 5.0
  max_bars_beyond: 3
  lookback_bars: 20
  swing_strength: 3
  point: 0.0
  pip_factor: 10.0

amd:
  min_accumulation_bars: 15
  max_accumulation_bars: 80
  range_atr_max: 1.5
  min_sweep_depth_pips: 5.0
  min_displacement_atr: 1.5
  equal_tolerance_pips: 3.0
  point: 0.0
  pip_factor: 10.0

mtf:
  htf_swing_strength: 5
  mtf_swing_strength: 3
  ltf_swing_strength: 2
  htf_lookback_bars: 100
  mtf_lookback_bars: 100
  ltf_lookback_bars: 50
  structure_point: 0.0

circuit_breaker:
  level_1_losses: 3
  level_2_losses: 5
  level_3_dd: 3.0
  level_4_dd: 4.0
  level_5_dd: 4.5
  cooldown_minutes:
    level_1: 5
    level_2: 15
    level_3: 30
    level_4: 1440
  size_multipliers:
    level_2: 0.75
    level_3: 0.5
  auto_recovery: true

consistency:
  daily_profit_cap_pct: 30.0

telemetry:
  enabled: true
  path: logs/telemetry.jsonl
  capture:
    spread: true
    circuit: true
    cutoff: true
    metrics: true

