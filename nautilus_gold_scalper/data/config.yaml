# Data Configuration for NautilusTrader Backtests
# SINGLE SOURCE OF TRUTH for data paths

active_dataset:
  name: "XAUUSD Tick Data 2003-2025 (Stride 20 - Default)"
  path: "../data/raw/full_parquet/xauusd_2003_2025_stride20_full.parquet"
  native_catalog_path: "../data/catalog_native/xauusd_2003_2025_stride1_COMPLETE_filtered_from_20200101_consolidated_7d"
  format: "parquet"
  instrument: "XAU/USD.SIM"
  data_type: "quote_tick"
  period:
    start: "2003-05-05"
    end: "2025-11-28"
