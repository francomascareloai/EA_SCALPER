[project]
name = "deep-reasoning-mcp"
version = "0.1.0"
description = "MCP Server for Deep Reasoning - Access GPT-5 Pro, O1-Pro, Gemini DeepThink via web interfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "playwright>=1.40.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
deep-reasoning-mcp = "deep_reasoning_mcp.server:main"
